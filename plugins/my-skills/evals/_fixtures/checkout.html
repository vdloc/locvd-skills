<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Checkout</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; color: #222; background: #fff; }
  *:focus { outline: none; }
  header { padding: 13px 27px; border-bottom: 1px solid #eee; }
  header h1 { font-size: 22px; margin: 0; }
  main { max-width: 960px; margin: 0 auto; padding: 11px 27px; }
  .summary { display: flex; gap: 19px; align-items: center; margin-bottom: 27px; }
  .summary img.product { width: 120px; height: 120px; }
  .summary p { font-size: 15px; margin: 0; }
  .divider { display: block; width: 100%; height: 12px; margin: 16px 0; }
  form .row { display: flex; gap: 16px; margin-bottom: 13px; }
  form .field { display: flex; flex-direction: column; gap: 4px; }
  form .field.w1 { width: 140px; }
  form .field.w2 { width: 310px; }
  form .field.w3 { width: 220px; }
  label { font-size: 13px; font-weight: 700; }
  input { font-size: 17px; padding: 9px 11px; border: 1px solid #ddd; border-radius: 3px; }
  input.error { border-color: #e00; }
  .req { color: #e00; }
  .help { font-size: 11px; color: #aaa; }
  .coupon { display: inline-block; padding: 6px 10px; background: #f3f3f3; font-size: 13px; cursor: pointer; }
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  .btn-primary { background: #0b5fff; color: #fff; border: 0; border-radius: 6px; padding: 12px 20px; font-size: 17px; }
  .btn-secondary { background: #fff; color: #0b5fff; border: 2px solid #0b5fff; border-radius: 6px; padding: 10px 18px; font-size: 17px; }
  .icon-btn { background: none; border: 0; width: 20px; height: 20px; padding: 0; }
  .fine { font-size: 11px; color: #555; margin-top: 19px; }
</style>
</head>
<body>
<header><h1>Checkout</h1></header>
<main>
  <section class="summary">
    <img class="product" src="trail-runner.jpg">
    <p>Trail Runner GTX, size 42 — €129.00</p>
    <button class="icon-btn" type="button"><svg viewBox="0 0 20 20" width="20" height="20"><path d="M6 6l8 8M14 6l-8 8" stroke="#555" stroke-width="2"/></svg></button>
  </section>

  <img class="divider" src="wave.svg" alt="">

  <form id="checkout" action="/pay" method="post">
    <div class="row">
      <div class="field w3">
        <label for="first">First name <span class="req">*</span></label>
        <input id="first" name="first" autocomplete="given-name">
      </div>
      <div class="field w3">
        <label for="last">Last name <span class="req">*</span></label>
        <input id="last" name="last" autocomplete="family-name">
      </div>
    </div>
    <div class="row">
      <div class="field w2">
        <input name="email" type="email" placeholder="Email address">
      </div>
      <div class="field w1">
        <input name="phone" placeholder="Phone (optional)">
      </div>
    </div>
    <div class="row">
      <div class="field w2">
        <label for="card">Card number <span class="req">*</span></label>
        <input id="card" name="card" class="error" inputmode="numeric" value="4111 1111 1111">
        <span class="help">We never store your card details.</span>
      </div>
    </div>
    <div class="coupon" onclick="applyCoupon()">Apply coupon</div>

    <div class="actions">
      <button class="btn-primary" type="submit" disabled>Pay now</button>
      <button class="btn-primary" type="button">Save for later</button>
      <button class="btn-secondary" type="button">Back to cart</button>
    </div>
    <p class="fine">By paying you accept our terms. <a href="/terms">Click here</a> to read them.</p>
  </form>
</main>
</body>
</html>
